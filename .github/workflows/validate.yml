name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source, TypeScript and Expo config
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: Install project dependencies
        run: bash scripts/ci-install-dependencies.sh

      - name: Run full source verification
        run: npm run verify:all

      - name: Run semantic TypeScript check
        run: npm run typecheck

      - name: Check Expo SDK package compatibility
        run: npx expo install --check

      - name: Resolve and validate public Expo configuration
        shell: bash
        run: |
          npx expo config --type public --json > "$RUNNER_TEMP/sheademtula-expo-config.json"
          node --input-type=commonjs - "$RUNNER_TEMP/sheademtula-expo-config.json" <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (config.ios?.bundleIdentifier !== 'shademtula.app') throw new Error('Unexpected iOS bundle identifier');
          if (config.android?.package !== 'shademtula.app') throw new Error('Unexpected Android application ID');
          if (config.extra?.audioCatalogMode !== 'single-featured-google-drive-rss') throw new Error('Unexpected Quran feed mode');
          console.log('Resolved Expo configuration is valid.');
          NODE
